# Release VERIFICATION for the production line. This workflow does NOT publish.
#
# It used to. Lane F (PASS 84) found that its staging and publish steps still described the
# pre-PASS-80 topology - the-big-one, pass72/70/69-retained, recent-stable, pass63-rollback -
# while every pass since 74 has shipped through scripts/orchestration/publish_pass<N>.py and
# gh-pages has carried exactly two trees since HF-400 (owner, 2026-09-02 06:58 BST: "when you
# push the next pass, pin this version and remove all past versions, this can be the safe
# backup"). Its publish step ran the gh-pages CLI over dist/, which REPLACES the branch, so a
# single dispatch would have deleted the pinned safe backup and resurrected six retired trees
# over the live site. It could not have run to completion either: `npm run verify:release-topology`
# threw `Root chooser is missing live PASS 86` on a correctly staged tree, because it spelled
# the live channel path as a literal (fixed in the same lane).
#
# PUBLISHING LIVES HERE, AND NOWHERE ELSE:
#     python scripts/orchestration/publish_pass<N>.py            # --dry-run first
#     python scripts/orchestration/publish_pass<N>.py --rollback # re-point the default
# That script enumerates the trees actually on gh-pages, retires everything that is not the
# live pass or its pinned backup, asserts the exact post-state before it commits, and carries
# the freshness, farcrysis-admission, release-identity, predecessor and in-build-fallback
# guards with their own red self-tests (scripts/orchestration/publish_pass<N>_plan.test.mjs).
# Rolling the stamp to the next pass is one command: scripts/orchestration/roll_pass.py.
#
# What this workflow is for: proving an exact main SHA is publishable. It reproduces the
# candidate bytes, revalidates the acceptance manifest, runs the static release gates, stages
# and verifies the full channel topology locally, checks the HF-400 two-channel policy, and
# uploads the evidence. A green run is the precondition for the publish command above.

name: release-verification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full origin/main SHA already green in verify
        required: true
        type: string
      release_pass:
        description: Exact approved live pass (e.g. PASS 86)
        required: true
        type: string

# contents: read only. This workflow has no write path to any branch by design - the
# permission itself is the guard, not just the absence of a publish step.
permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: atomic-acres-production-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture release workflow start
        shell: bash
        run: echo "RELEASE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - name: Validate immutable green main candidate
        run: node scripts/release/pipeline-guard.mjs release --source-sha "${{ inputs.source_sha }}" --pass "${{ inputs.release_pass }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build exact frozen-evidence candidate bytes
        run: npm run build
      - name: Validate accepted requirement manifest
        run: node scripts/release/acceptance-gate.mjs --phase release --pass "${{ inputs.release_pass }}" --head "${{ inputs.source_sha }}" --output artifacts/pipeline/acceptance-coverage.json
      - name: Reproduce static release gates
        run: npm run verify:pass25a:core
      - name: Capture immutable production build timestamp
        shell: bash
        run: |
          released_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "VITE_RELEASED_AT=$released_at" >> "$GITHUB_ENV"
          echo "RELEASE_BUILT_AT=$released_at" >> "$GITHUB_ENV"
      - name: Build production bytes
        run: npm run build
        env:
          VITE_MATCH_BUILD_ID: ${{ inputs.source_sha }}
          VITE_MATCH_DIAGNOSTICS_URL: https://atomic-acres-leaderboard.atomic-acres.workers.dev
      - name: Verify exact production bytes
        run: npm run verify:release-tree
      - name: Verify the HF-400 two-channel release policy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages
          node scripts/release/verify-two-channel-policy.mjs --json artifacts/pipeline/two-channel-policy.json
          node --test scripts/release/release-policy-contract.test.mjs
          node --test scripts/orchestration/publish-sibling-drift.test.mjs
      - name: Rebuild Pass 67.1 stable with its original Pages publication timestamp
        shell: bash
        run: |
          set -euo pipefail
          stable_source_sha="$(node -e "console.log(JSON.parse(require('fs').readFileSync('release-channels.json','utf8')).stable.sourceSha)")"
          stable_pages_sha="$(node -e "console.log(JSON.parse(require('fs').readFileSync('release-channels.json','utf8')).stable.pagesSha)")"
          git cat-file -e "${stable_source_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$stable_source_sha"
          git cat-file -e "${stable_pages_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$stable_pages_sha"
          stable_released_at="$(date -u -d "$(git show -s --format=%cI "$stable_pages_sha")" +'%Y-%m-%dT%H:%M:%SZ')"
          git worktree add artifacts/pass67-stable-src "$stable_source_sha"
          (cd artifacts/pass67-stable-src && npm ci --ignore-scripts && VITE_MATCH_BUILD_ID="$stable_source_sha" VITE_RELEASED_AT="$stable_released_at" npm run build)
          echo "RELEASE_STABLE_DIST=$(pwd)/artifacts/pass67-stable-src/dist" >> "$GITHUB_ENV"
          echo "STABLE_RELEASED_AT=$stable_released_at" >> "$GITHUB_ENV"
      - name: Install topology browser
        run: npx playwright install --with-deps chromium
      - name: Rebuild Pass 63 rollback with its original Pages publication timestamp
        shell: bash
        run: |
          set -euo pipefail
          rollback_source_sha="$(node -e "console.log(JSON.parse(require('fs').readFileSync('release-channels.json','utf8')).rollback.sourceSha)")"
          rollback_pages_sha="$(node -e "console.log(JSON.parse(require('fs').readFileSync('release-channels.json','utf8')).rollback.pagesSha)")"
          git cat-file -e "${rollback_source_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$rollback_source_sha"
          git cat-file -e "${rollback_pages_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$rollback_pages_sha"
          rollback_released_at="$(date -u -d "$(git show -s --format=%cI "$rollback_pages_sha")" +'%Y-%m-%dT%H:%M:%SZ')"
          git worktree add artifacts/pass63-rollback-src "$rollback_source_sha"
          (cd artifacts/pass63-rollback-src && npm ci --ignore-scripts && VITE_MATCH_BUILD_ID="$rollback_source_sha" VITE_RELEASED_AT="$rollback_released_at" npm run build)
          echo "RELEASE_ROLLBACK_DIST=$(pwd)/artifacts/pass63-rollback-src/dist" >> "$GITHUB_ENV"
          echo "ROLLBACK_RELEASED_AT=$rollback_released_at" >> "$GITHUB_ENV"
      - name: Stage the full local channel topology and verify it end to end
        run: |
          test -n "${RELEASE_BUILT_AT:-}"
          for channel_key in previous retained historical; do
            pinned_pages_sha="$(node -e "const c=JSON.parse(require('fs').readFileSync('release-channels.json','utf8')); console.log(c[process.argv[1]].pagesSha)" "$channel_key")"
            git cat-file -e "${pinned_pages_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$pinned_pages_sha"
          done
          # The Pass 62 best-ever-netcode benchmark pins a gh-pages commit that may be
          # orphaned from the current gh-pages tip after subsequent production deploys.
          # Fetch it explicitly so verify:benchmark --verify-git can resolve the rollback subtree.
          BENCH_PAGES_SHA=$(node -e "console.log(JSON.parse(require('fs').readFileSync('baselines/pass62/best-netcode-benchmark.json','utf8')).pagesSha)")
          git cat-file -e "${BENCH_PAGES_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BENCH_PAGES_SHA"
          npm run verify:benchmark -- --verify-git
          npm run stage:release-topology
          npm run verify:release-topology
          node scripts/qa/run-with-preview-server.mjs node scripts/qa/verify-release-topology-browser.mjs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_PASS: ${{ inputs.release_pass }}
          RELEASE_STABLE_DIST: ${{ env.RELEASE_STABLE_DIST }}
          STABLE_RELEASED_AT: ${{ env.STABLE_RELEASED_AT }}
          REQUIRE_STABLE_RELEASE_TIMESTAMP: '1'
          RELEASE_ROLLBACK_DIST: ${{ env.RELEASE_ROLLBACK_DIST }}
          ROLLBACK_RELEASED_AT: ${{ env.ROLLBACK_RELEASED_AT }}
          REQUIRE_ROLLBACK_RELEASE_TIMESTAMP: '1'
      - name: Write the release-candidate verification receipt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_PASS: ${{ inputs.release_pass }}
        run: |
          test -n "${RELEASE_BUILT_AT:-}"
          node scripts/release/write-verification-receipt.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-receipt-${{ inputs.source_sha }}
          path: artifacts/pipeline/**
          if-no-files-found: error
