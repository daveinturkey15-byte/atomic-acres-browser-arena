name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-change:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.impact.outputs.mode }}
      reason: ${{ steps.impact.outputs.reason }}
      windows_groups: ${{ steps.impact.outputs.windows_groups }}
      linux_groups: ${{ steps.impact.outputs.linux_groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify verification impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/release/change-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  static-and-unit:
    needs: classify-change
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cross-platform authoring command smoke
        run: node scripts/blender/run-authoring.mjs arena
        env:
          AUTHORING_DRY_RUN: "1"
      - run: npm run lint
      - run: npm run verify:gameplay-contract
      - run: npm run verify:provenance
      - run: npm run verify:killstreak-catalog
      - run: npm test
      - name: Verify Pass 73 required browser-group wiring
        run: npm run qa:pass73:ci-wiring-contract
      - run: npm run leaderboard:check
      - run: npm run build
        env:
          VITE_MATCH_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
          VITE_MATCH_DIAGNOSTICS_URL: https://atomic-acres-leaderboard.atomic-acres.workers.dev
      - run: npm run verify:release-tree
      - name: Write immutable PR preview receipt
        if: github.event_name == 'pull_request' && runner.os == 'Linux' && needs.classify-change.outputs.mode != 'none'
        run: node scripts/release/write-preview-receipt.mjs --head "${{ github.event.pull_request.head.sha }}" --pr "${{ github.event.pull_request.number }}"
      - name: Upload immutable PR preview
        if: github.event_name == 'pull_request' && runner.os == 'Linux' && needs.classify-change.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            dist/
            artifacts/pipeline/pr-preview.json
            acceptance/pass-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Production dependency audit
        if: runner.os == 'Linux'
        run: npm run audit:dependencies

  requirements-acceptance:
    needs: [classify-change, static-and-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build candidate bytes for acceptance verification
        run: npm run build
      # HF-536. A release-line reconciliation PR is the one shape --phase ci
      # cannot evaluate: its tree is byte-identical to its first parent, so it
      # necessarily touches every enforced pass manifest at once and
      # selectCiAcceptanceManifest correctly throws "found 6".
      #
      # The reconciliation phase is entered ONLY when a repository writer has
      # applied the `reconciliation` label to the pull request. It is never
      # inferred from the commit shape, so an accidental two-parent head still
      # takes the normal --phase ci path and still fails there. The phase is
      # fail-closed on every other shape and grants no acceptance.
      - name: Verify changed acceptance manifest and write the selector receipt
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'reconciliation') }}
        run: node scripts/release/acceptance-gate.mjs --phase ci --impact "${{ needs.classify-change.outputs.mode }}" --base "${{ github.event.pull_request.base.sha || github.event.before }}" --head "${{ github.event.pull_request.head.sha || github.sha }}" --output artifacts/pipeline/acceptance-coverage.json
      - name: Verify the selected immutable preview provenance and bytes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'reconciliation') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-pr-preview-provenance.mjs --acceptance-receipt artifacts/pipeline/acceptance-coverage.json --output artifacts/pipeline/pr-preview-provenance.json
      # Preview provenance is inherited by tree identity here and is therefore
      # asserted, not skipped: the reconciliation gate proves head^{tree} ==
      # head^1^{tree}, so the merge ships exactly the bytes of a commit that
      # already exists on the contribution line. Owner acceptance of those bytes
      # stays owed on that line; the receipt records grantsAcceptance:false.
      - name: Verify the release-line reconciliation merge shape
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'reconciliation') }}
        run: node scripts/release/acceptance-gate.mjs --phase reconciliation --impact "${{ needs.classify-change.outputs.mode }}" --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --output artifacts/pipeline/acceptance-coverage.json
      - name: Upload acceptance coverage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/pipeline/acceptance-coverage.json
            artifacts/pipeline/pr-preview-provenance.json
          if-no-files-found: warn
          retention-days: 30

  bounded-browser-windows:
    needs: [classify-change, static-and-unit]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Record browser gate decision
        run: echo "mode=${{ needs.classify-change.outputs.mode }} reason=${{ needs.classify-change.outputs.reason }}"
      - uses: actions/checkout@v4
        if: needs.classify-change.outputs.mode != 'none'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: needs.classify-change.outputs.mode != 'none'
        with:
          node-version: 22
          cache: npm
      - if: needs.classify-change.outputs.mode != 'none'
        run: npm ci --ignore-scripts
      - if: needs.classify-change.outputs.mode != 'none'
        run: npx playwright install chromium
      - if: needs.classify-change.outputs.mode != 'none'
        run: npm run build
        env:
          VITE_MATCH_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
          VITE_MATCH_DIAGNOSTICS_URL: https://atomic-acres-leaderboard.atomic-acres.workers.dev
      - name: Run Pass 73 gameplay regression contracts
        if: needs.classify-change.outputs.mode == 'full'
        timeout-minutes: 25
        run: node node_modules/@playwright/test/cli.js test tests/e2e/pass73-gameplay-regressions.spec.ts tests/e2e/pass73-network-reveal-authority.spec.ts --project=chromium --workers=1 --retries=0
      - name: Run bounded browser groups
        if: needs.classify-change.outputs.mode != 'none'
        env:
          QA_E2E_GROUPS: ${{ needs.classify-change.outputs.windows_groups }}
        run: |
          $env:QA_E2E_GROUPS = (($env:QA_E2E_GROUPS -split ',') | Where-Object { $_ -ne 'pass73-gameplay-regressions' }) -join ','
          npm run test:e2e:bounded
      - name: Run Pass 64 HUD browser contracts
        if: needs.classify-change.outputs.mode == 'full'
        timeout-minutes: 10
        run: node node_modules/@playwright/test/cli.js test tests/e2e/pass64-hud-menu.spec.ts --project=chromium --workers=1 --retries=0
      - name: Run Pass 65 menu lifecycle contracts
        if: needs.classify-change.outputs.mode == 'full'
        timeout-minutes: 13
        run: node node_modules/@playwright/test/cli.js test tests/e2e/pass65-menu-lifecycle.spec.ts --project=chromium --workers=1 --retries=0
      - name: Upload Windows browser failure evidence
        if: failure() && needs.classify-change.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: bounded-browser-windows-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/pass25a/playwright-results/
            artifacts/pass65/menu-lifecycle/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  bounded-browser-linux:
    needs: [classify-change, static-and-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Record browser gate decision
        run: echo "mode=${{ needs.classify-change.outputs.mode }} reason=${{ needs.classify-change.outputs.reason }}"
      - uses: actions/checkout@v4
        if: needs.classify-change.outputs.mode != 'none'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: needs.classify-change.outputs.mode != 'none'
        with:
          node-version: 22
          cache: npm
      - if: needs.classify-change.outputs.mode != 'none'
        run: npm ci --ignore-scripts
      - if: needs.classify-change.outputs.mode != 'none'
        run: npx playwright install --with-deps chromium
      - if: needs.classify-change.outputs.mode != 'none'
        env:
          QA_E2E_GROUPS: ${{ needs.classify-change.outputs.linux_groups }}
        run: |
          # Pass 73's real-time multiplayer gate is Windows Chrome-owned. The
          # Linux headless software renderer runs at 1-2 FPS and cannot make a
          # truthful gameplay-timing claim; retain the remaining Linux matrix.
          export QA_E2E_GROUPS="$(node -e "process.stdout.write(process.env.QA_E2E_GROUPS.split(',').filter((group) => group !== 'pass73-gameplay-regressions').join(','))")"
          npm run test:e2e:bounded
      - name: Upload Linux browser failure evidence
        if: failure() && needs.classify-change.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: bounded-browser-linux-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/pass25a/playwright-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  pipeline-metrics:
    if: always()
    needs: [classify-change, requirements-acceptance, static-and-unit, bounded-browser-linux, bounded-browser-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download acceptance receipt
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: acceptance-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/acceptance
      - name: Record workflow timing and acceptance metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/workflow-metrics.mjs --acceptance artifacts/acceptance/acceptance-coverage.json --output artifacts/pipeline/workflow-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/pipeline/workflow-metrics.json
          if-no-files-found: error
          retention-days: 90
