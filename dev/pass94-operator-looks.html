<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PASS 94 operator look and gait capture</title>
    <style>
      html, body { margin: 0; background: #14171a; color: #dfe6ea; font: 13px/1.3 system-ui, sans-serif; }
      #sheet { position: relative; width: 1600px; }
      canvas { display: block; width: 1600px; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .label {
        position: absolute; padding: 2px 6px; background: rgba(8, 10, 12, 0.72);
        border-left: 3px solid #35d7c8; font-weight: 600; letter-spacing: 0.02em;
      }
      #status { padding: 6px 10px; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="sheet"><div id="labels"></div></div>
    <div id="status">booting</div>
    <script type="module" src="./pass94-operator-looks.ts"></script>

</html>
